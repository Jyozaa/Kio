name: Kio Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build, test, and package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(./scripts/version.sh)"
          ./scripts/check.sh
          ./scripts/package-dmg.sh
          gh release create "$GITHUB_REF_NAME" "build/release/Kio-$VERSION.dmg" "build/release/Kio-$VERSION.dmg.sha256" --generate-notes
