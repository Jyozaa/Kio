name: Kio CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Cache pinned Reel runtime
        uses: actions/cache@v4
        with:
          path: .cache/reel
          key: reel-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Packages/KioKit/Sources/KioTools/Resources/ReelRuntime.json', 'scripts/build-reel-runtime.sh') }}
      - name: Prepare pinned Reel runtime
        run: ./scripts/build-reel-runtime.sh
      - name: Build and test
        run: ./scripts/check.sh
