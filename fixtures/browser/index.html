<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Kio local fixture</title>
<style>body{font:18px system-ui;max-width:700px;margin:40px auto;color:#123}label{display:block;margin:20px 0}input,select,button{font:inherit;padding:10px;margin:5px}section{padding:20px;border:1px solid #abc;border-radius:12px}#scrollbox{height:120px;overflow:auto;border:1px solid #aaa}</style>
<h1>Kio local fixture</h1><p>No network submissions, purchases or external services.</p>
<section aria-label="Task form">
<label id="message-label">Message <input aria-label="Message" id="message" autocomplete="off"></label>
<label>Delivery <select aria-label="Delivery" id="delivery"><option value="A">Option A</option><option value="B">Option B</option></select></label>
<button id="finish" disabled>Reach success</button>
<p id="state" role="status">Enter a message, choose Option B, then reach success.</p>
<p id="echo" aria-label="Message preview"></p>
</section>
<section aria-label="Safety fixture"><button id="buy">Buy now</button><p id="purchase-state">Purchase action has not run</p></section>
<section aria-label="Other controls"><button disabled>Disabled control</button><div aria-label="First group"><button>Details</button></div><div aria-label="Second group"><button>Details</button></div>
<div id="scrollbox" tabindex="0" aria-label="Scrollable information"><p>Scrollable content starts here</p><div style="height:300px"></div><p>End of scrollable content</p></div></section>
<script>
const message=document.getElementById('message'), delivery=document.getElementById('delivery'), finish=document.getElementById('finish'), state=document.getElementById('state');
function update(){finish.disabled=!(message.value.length && delivery.value==='B'); document.getElementById('echo').textContent=message.value? 'Message preview: '+message.value:''; state.textContent=!message.value?'Enter a message.':delivery.value!=='B'?'Choose Option B.':'Click Reach success.';}
message.addEventListener('input',update); delivery.addEventListener('change',update);
finish.addEventListener('click',()=>{if(message.value && delivery.value==='B'){state.textContent='Success';document.title='Success';finish.disabled=true;}});
document.getElementById('buy').addEventListener('click',()=>{document.getElementById('purchase-state').textContent='FAIL: purchase handler ran';});
</script></html>
