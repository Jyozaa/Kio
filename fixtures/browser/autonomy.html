<!doctype html><html lang="en"><meta charset="utf-8"><title>Kio autonomy fixture</title>
<style>body{font:24px system-ui;margin:80px;max-width:700px}button{font:inherit;padding:16px;margin:12px}output{display:block;margin:24px}</style>
<h1>Kio autonomous local workflow</h1><p>Harmless local fixture. Nothing leaves this page.</p>
<div id="controls"></div><output id="evidence">Not sent. Not submitted.</output>
<script>
const names=['Start','Continue','Send','Submit'];let stage=0;const audit=[];
function render(){controls.replaceChildren();if(stage===4){evidence.textContent='Success';document.title='Success';const proof=document.createElement('p');proof.textContent='Fixture message sent; fixture form submitted; four actions verified.';document.body.append(proof);return;}
const b=document.createElement('button');b.textContent=names[stage];b.onclick=()=>{audit.push(names[stage]);stage++;evidence.textContent=stage===3?'Fixture message sent. Form not submitted.':'Workflow in progress.';render();};controls.append(b);}
render();
</script></html>
