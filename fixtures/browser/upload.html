<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>Kio local upload fixture</title>
<style>
body{font:18px system-ui;max-width:700px;margin:40px auto;color:#123}
label{display:block;margin:20px 0}
input,button{font:inherit;padding:10px;margin:5px}
</style>
<h1>Kio local upload fixture</h1>
<p>This fixture never sends files over the network.</p>
<label for="file">Fixture file</label>
<input id="file" type="file" accept=".txt,text/plain">
<p id="selected" role="status">No file selected</p>
<button id="submit" disabled>Submit local upload</button>
<p id="result" role="status"></p>
<script>
const input=document.getElementById('file'),selected=document.getElementById('selected');
const submit=document.getElementById('submit');
input.addEventListener('change',()=>{
  const file=input.files?.[0];
  selected.textContent=file?`Selected ${file.name}`:'No file selected';
  submit.disabled=!file;
});
submit.addEventListener('click',()=>{
  if(input.files?.length){document.getElementById('result').textContent='Success';document.title='Success';}
});
</script>
</html>
