<!doctype html><html lang="en"><meta charset="utf-8"><title>Kio long local workflow</title>
<style>body{font:24px system-ui;padding:60px;max-width:800px}button{font:inherit;padding:18px 40px}progress{display:block;margin:24px 0;width:100%}</style>
<h1>Local workspace setup</h1><p>No information leaves this fixture.</p>
<h2 id="stage"></h2><p id="detail"></p><progress max="12" value="0"></progress>
<button id="next">Continue</button><div id="result" role="status">Not complete</div>
<script>
const tasks = ["Create workspace", "Choose local storage", "Check folders", "Set display", "Configure editor", "Choose keyboard layout", "Set local backups", "Check import format", "Build local index", "Validate settings", "Review configuration", "Finish workspace"];
let step = 0; const audit = [];
function render(){document.querySelector('#stage').textContent=`Step ${step+1}: ${tasks[step]}`;document.querySelector('#detail').textContent='Continue confirms this local setup step.';}
document.querySelector('#next').onclick=()=>{audit.push(tasks[step]);step++;document.querySelector('progress').value=step;if(step===12){document.querySelector('#next').remove();document.querySelector('#stage').textContent='Setup complete';document.querySelector('#detail').textContent='';const valid=audit.length===12&&audit.every((value,i)=>value===tasks[i]);document.querySelector('#result').textContent=valid?'Success':'Invalid workflow';document.title=valid?'Success':'Failed';}else{render();}};
render();
</script></html>
