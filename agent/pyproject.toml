[project]
name = "companion-agent"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.28,<1",
    "laya>=0.3.20",
    "laya-mlx @ git+https://github.com/mizorewww/laya-mlx@0a859518634112655cb97c745dbf04f5191aaf13 ; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "mcp>=1.12,<2",
]

[project.scripts]
companion-agent = "companion_agent.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[dependency-groups]
dev = ["pytest>=8,<9", "ruff>=0.12,<1"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["**/.venv*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
